paragraphs:
- I am currently an M.S. student in the Department of AI Convergence Security at Soongsil University, advised by
  [Prof. Jinhong Jung](https://jinhongjung.github.io). I received my B.S. in Software from Soongsil University in
  2025 and plan to pursue my Ph.D. in the same research group.
- My research interests include data mining, graph machine learning, and personalized AI. I am particularly interested
  in revisiting the assumptions behind existing approaches to understand their limitations and identify meaningful 
  research questions.
  
